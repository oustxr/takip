name: Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Takip.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Takip
          path: Takip.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Takip.apk --clobber
          else
            gh release create v1.0.0 Takip.apk \
              --title "v1.0.0" \
              --notes ""
          fi
